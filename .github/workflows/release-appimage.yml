# Build and attach a Linux AppImage to GitHub Releases when a version tag is pushed.
name: Release AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # wxPython ships Linux only as sdist on PyPI; the build needs GTK/WebKit -dev packages.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-0 \
            libgtk-3-dev \
            libnotify4 \
            libsdl2-2.0-0 \
            libsdl2-dev \
            libwebkit2gtk-4.0-37 \
            libwebkit2gtk-4.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libsm-dev \
            libxtst6 \
            xvfb \
            libfuse2 \
            file

      - name: Install Python package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install appimagetool
        run: |
          wget -q -O /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build PyInstaller bundle (standalone, no Pretix)
        run: xvfb-run -a pyinstaller packaging/pyinstaller-minimal.spec

      - name: Build AppImage (standalone)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DIST_NAME: niimbot-printer-minimal
          APPIMAGE_VARIANT: ""
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0+${GITHUB_SHA:0:7}"
          fi
          ./packaging/build-appimage.sh

      - name: Build PyInstaller bundle (with Pretix)
        run: xvfb-run -a pyinstaller packaging/pyinstaller.spec

      - name: Build AppImage (with Pretix)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DIST_NAME: niimbot-printer
          APPIMAGE_VARIANT: pretix
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0+${GITHUB_SHA:0:7}"
          fi
          ./packaging/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: niimbot-printer-appimage
          path: dist/*.AppImage

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
